<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132b42"><title>中阿混合人称抽卡 | Arabic Classroom</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif;color:#16334a;background:#f2f6fa}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top right,#d9eaf2,transparent 55%),#f2f6fa}.wrap{max-width:720px;margin:auto;padding:22px 18px 45px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#286781;text-decoration:none;font-weight:600}.logo{font-size:13px;letter-spacing:.1em;color:#527285}.panel{margin-top:26px;text-align:center}h1{font-size:clamp(24px,5vw,35px);margin:0 0 8px}.sub{color:#587287;margin:0 0 22px;font-size:15px}.status{display:flex;align-items:center;justify-content:space-between;max-width:470px;margin:0 auto 12px;font-size:13px;color:#5d7687}.pill{background:#dcebf2;border-radius:30px;padding:7px 12px;font-weight:700}.card{border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;width:min(100%,470px);margin:auto;padding:26px;background:#fff;border-radius:26px;box-shadow:0 18px 45px #22476319;position:relative;transition:transform .16s}.card:active{transform:scale(.992)}.tag{position:absolute;top:24px;left:24px;background:#eaf3f8;color:#316882;padding:7px 13px;border-radius:20px;font-size:13px;font-weight:700}.prompt{font-size:clamp(29px,7vw,52px);font-weight:800;line-height:1.5;margin:25px 0 7px}.arabic{font-family:"Geeza Pro","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;font-size:clamp(54px,11vw,78px);line-height:1.9}.hint{font-size:13px;color:#8296a5}.answer{width:min(100%,470px);margin:14px auto 0;padding:17px 20px;background:#e5f4ee;border:1px solid #bde2d0;border-radius:17px;text-align:center;min-height:90px}.answer[hidden]{display:none}.answer .value{font-size:25px;font-weight:800;color:#1e624e}.answer .ar{font-family:"Geeza Pro","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;font-size:36px;line-height:1.6}.answer small{display:block;color:#467363;margin-top:3px}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px auto 0;max-width:500px}button{cursor:pointer;border:0;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:750;min-height:50px}.primary{background:#176e83;color:white;flex:1 1 175px}.secondary{background:#fff;color:#215b72;border:1px solid #c8dae4;flex:1 1 135px}.settings{max-width:470px;margin:24px auto 0;background:#ffffffb8;padding:18px;border-radius:18px;text-align:left}.settings h2{font-size:16px;margin:0 0 14px}.settingrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.switch{display:flex;align-items:center;gap:8px;font-size:14px}.switch input{width:18px;height:18px;accent-color:#176e83}.reset{font-size:13px;padding:9px 12px;background:#eaf1f5;color:#38657b}.note{max-width:470px;margin:15px auto 0;color:#627e8d;font-size:13px;line-height:1.8;text-align:left}.toast{min-height:21px;margin-top:10px;color:#39707d;font-size:13px}@media(max-width:430px){.card{min-height:285px}.wrap{padding:18px 13px 36px}.tag{top:17px;left:17px}}
</style></head><body><main class="wrap"><header><span class="logo">ARABIC CLASSROOM</span><a href="index.html">⌂ 返回首页</a></header><section class="panel"><h1>中阿混合人称抽卡</h1><p class="sub">随机出现中文或阿语人称，练习动词变位</p><div class="status"><span class="pill" id="counter">剩余 28 / 28 张</span><span id="modeLabel">不重复抽取</span></div><div class="card" id="card" aria-live="polite"><span class="tag" id="language">准备开始</span><div class="prompt" id="prompt">点击「抽一张」</div><div class="hint" id="cardHint">中文、阿语随机混合</div></div><div class="answer" id="answer" hidden aria-live="polite"><div class="value" id="answerText"></div><small id="answerDetail"></small></div><div class="buttons"><button class="primary" id="draw">🎴 抽一张</button><button class="secondary" id="reveal" disabled>显示对应人称</button></div><div class="toast" id="toast" role="status"></div></section><section class="settings"><h2>抽卡设置</h2><div class="settingrow"><label class="switch"><input id="repeat" type="checkbox">允许重复抽取</label><button class="reset" id="reset">↻ 重新洗牌</button></div></section><p class="note">共 28 张：14 张中文人称 + 14 张阿语人称。对于 هُمَا 和 أَنْتُمَا 等形式相同但变位位置不同的卡片，会额外标注阳性或阴性，避免歧义。每次抽卡后，让学生按当前指定的动词和时态回答。</p></main><script>
'use strict';
const slots=[
{id:'1s',zh:'我',ar:'أَنَا',detail:'第一人称 · 单数'},
{id:'1p',zh:'我们',ar:'نَحْنُ',detail:'第一人称 · 复数'},
{id:'2ms',zh:'你（男性）',ar:'أَنْتَ',detail:'第二人称 · 阳性单数'},
{id:'2fs',zh:'你（女性）',ar:'أَنْتِ',detail:'第二人称 · 阴性单数'},
{id:'2md',zh:'你们俩（男性）',ar:'أَنْتُمَا',detail:'第二人称 · 阳性双数'},
{id:'2fd',zh:'你们俩（女性）',ar:'أَنْتُمَا',detail:'第二人称 · 阴性双数'},
{id:'2mp',zh:'你们（男性）',ar:'أَنْتُمْ',detail:'第二人称 · 阳性复数'},
{id:'2fp',zh:'你们（女性）',ar:'أَنْتُنَّ',detail:'第二人称 · 阴性复数'},
{id:'3ms',zh:'他',ar:'هُوَ',detail:'第三人称 · 阳性单数'},
{id:'3fs',zh:'她',ar:'هِيَ',detail:'第三人称 · 阴性单数'},
{id:'3md',zh:'他们俩（男性）',ar:'هُمَا',detail:'第三人称 · 阳性双数'},
{id:'3fd',zh:'她们俩（女性）',ar:'هُمَا',detail:'第三人称 · 阴性双数'},
{id:'3mp',zh:'他们（男性）',ar:'هُمْ',detail:'第三人称 · 阳性复数'},
{id:'3fp',zh:'她们（女性）',ar:'هُنَّ',detail:'第三人称 · 阴性复数'}];
const deck=slots.flatMap(s=>[{...s,lang:'zh'},{...s,lang:'ar'}]);let remaining=[],current=null;const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function update(){const repeat=$('repeat').checked;$('counter').textContent=repeat?'完全随机 · 28 种卡片':`剩余 ${remaining.length} / 28 张`;$('modeLabel').textContent=repeat?'允许重复':'不重复抽取'}function reset(){remaining=shuffle([...deck]);current=null;$('language').textContent='准备开始';$('prompt').textContent='点击「抽一张」';$('prompt').className='prompt';$('cardHint').textContent='中文、阿语随机混合';$('answer').hidden=true;$('reveal').disabled=true;$('toast').textContent='已重新洗牌';update()}function draw(){const repeat=$('repeat').checked;if(!repeat&&!remaining.length){remaining=shuffle([...deck]);$('toast').textContent='上一轮已抽完，自动开始新一轮'}else{$('toast').textContent=''}current=repeat?deck[Math.floor(Math.random()*deck.length)]:remaining.pop();$('language').textContent=current.lang==='zh'?'中文人称':'阿拉伯语人称';$('prompt').textContent=current.lang==='zh'?current.zh:current.ar;$('prompt').className='prompt'+(current.lang==='ar'?' arabic':'');$('cardHint').textContent=current.lang==='ar'&&['2md','2fd','3md','3fd'].includes(current.id)?current.detail:'请说出指定动词的正确变位';$('answer').hidden=true;$('reveal').disabled=false;$('reveal').textContent='显示对应人称';update()}function reveal(){if(!current)return;const a=$('answerText');a.textContent=current.lang==='zh'?current.ar:current.zh;a.className='value'+(current.lang==='zh'?' ar':'');$('answerDetail').textContent=current.detail;$('answer').hidden=false;$('reveal').textContent='答案已显示'}$('draw').addEventListener('click',draw);$('reveal').addEventListener('click',reveal);$('reset').addEventListener('click',reset);$('repeat').addEventListener('change',()=>{remaining=shuffle([...deck]);$('toast').textContent='模式已切换';update()});reset();
</script></body></html>
