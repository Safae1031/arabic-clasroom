<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>阿拉伯语人称抽卡 · Arabic Classroom</title><style>
:root{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#20304c;background:#f2f6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{max-width:750px;margin:auto;padding:26px 18px 45px}header{text-align:center}h1{font-size:clamp(26px,5vw,36px);margin:14px 0 6px}.sub{color:#64748b;margin:0 0 23px}.panel{background:white;border-radius:22px;padding:20px;box-shadow:0 10px 35px #284f8b15}.options{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin-bottom:17px}label{display:flex;align-items:center;gap:7px;font-size:15px}select{padding:9px;border:1px solid #cbd5e1;border-radius:10px;background:white;font-size:15px}.status{text-align:center;color:#53647c;margin:12px}.card{width:100%;min-height:270px;border:2px solid #b8ccef;border-radius:22px;background:linear-gradient(145deg,#edf4ff,#fff);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;padding:25px;transition:transform .15s}.card:active{transform:scale(.99)}.eyebrow{font-size:15px;color:#667b9c}.prompt{font-weight:750;font-size:clamp(45px,10vw,72px);line-height:1.6}.arabic{font-size:clamp(35px,8vw,53px);direction:rtl;color:#1761ac;line-height:1.6}.hidden{display:none}.hint{font-size:14px;color:#718096}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}button{border:0;border-radius:12px;padding:14px 20px;font-weight:700;font-size:17px;cursor:pointer;touch-action:manipulation}button.primary{background:#2466d3;color:white;min-width:140px}button.secondary{background:#e8effb;color:#244c8b}button:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}.foot{text-align:center;color:#63748a;font-size:14px;line-height:1.7;margin-top:18px}.note{font-size:13px;color:#68798e;margin-top:10px;text-align:center}
</style></head><body><main class="wrap"><header><h1>🎴 阿拉伯语人称抽卡</h1><p class="sub">看阿拉伯语人称，完成指定动词的变位</p></header><section class="panel"><div class="options"><label for="mode">抽卡模式 <select id="mode"><option value="deck">不重复（抽完自动洗牌）</option><option value="random">完全随机（可重复）</option></select></label></div><div class="status" id="status" aria-live="polite">准备开始 · 共 14 张卡片</div><div class="card" id="card" aria-live="polite"><div class="eyebrow" id="eyebrow">点击下方按钮</div><div class="prompt" id="prompt">准备好了吗？</div><div class="arabic hidden" id="answer" lang="ar"></div><div class="hint" id="hint">随机抽取一个阿语人称</div></div><div class="actions"><button class="primary" id="draw">🎲 抽一张</button><button class="secondary" id="reveal" disabled>👀 显示中文释义</button><button class="secondary" id="reset">🔄 重新洗牌</button></div><div class="note">注：هُمَا 和 أَنْتُمَا 分别对应阳性、阴性双数。抽到这两种人称时，请先查看中文释义确认性别，再进行变位。</div></section><p class="foot">课堂玩法：指定一个动词（如 كَتَبَ），学生根据卡片上的阿语人称说出对应的过去式或现在式。<br>支持 iPad、手机和电脑，无需安装应用。</p></main><script>
'use strict';
const cards=[
['他（阳性单数）','هُوَ'],['他们俩（阳性双数）','هُمَا'],['他们（阳性复数）','هُمْ'],
['她（阴性单数）','هِيَ'],['她们俩（阴性双数）','هُمَا'],['她们（阴性复数）','هُنَّ'],
['你（阳性单数）','أَنْتَ'],['你们俩（阳性双数）','أَنْتُمَا'],['你们（阳性复数）','أَنْتُمْ'],
['你（阴性单数）','أَنْتِ'],['你们俩（阴性双数）','أَنْتُمَا'],['你们（阴性复数）','أَنْتُنَّ'],
['我','أَنَا'],['我们','نَحْنُ']
];
const $=id=>document.getElementById(id);let deck=[],current=null,drawn=0;
function shuffle(){deck=cards.map((_,i)=>i);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}}
function reset(){shuffle();drawn=0;current=null;$('eyebrow').textContent='点击下方按钮';$('prompt').textContent='准备好了吗？';$('prompt').removeAttribute('lang');$('prompt').removeAttribute('dir');$('answer').textContent='';$('answer').classList.add('hidden');$('hint').textContent='随机抽取一个阿语人称';$('reveal').disabled=true;$('reveal').textContent='👀 显示中文释义';$('status').textContent='准备开始 · 共 14 张卡片';}
function draw(){if($('mode').value==='deck'){if(deck.length===0){shuffle();drawn=0;}current=cards[deck.pop()];drawn++;$('status').textContent=`本轮已抽 ${drawn}/14 张${deck.length===0?' · 下一次自动洗牌':''}`;}else{current=cards[Math.floor(Math.random()*cards.length)];drawn++;$('status').textContent=`随机模式 · 已抽 ${drawn} 次`;} $('eyebrow').textContent='请根据阿拉伯语人称完成动词变位';$('prompt').textContent=current[1];$('prompt').setAttribute('lang','ar');$('prompt').setAttribute('dir','rtl');$('answer').textContent=current[0];$('answer').setAttribute('lang','zh-CN');$('answer').setAttribute('dir','ltr');$('answer').classList.add('hidden');$('hint').textContent='完成动词变位后，可查看中文释义';$('reveal').disabled=false;$('reveal').textContent='👀 显示中文释义';}
$('draw').addEventListener('click',draw);$('reveal').addEventListener('click',()=>{if(!current)return;let hidden=$('answer').classList.toggle('hidden');$('hint').textContent=hidden?'完成动词变位后，可查看中文释义':'核对人称后，继续完成动词变位';$('reveal').textContent=hidden?'👀 显示中文释义':'🙈 隐藏中文释义';});$('reset').addEventListener('click',reset);$('mode').addEventListener('change',reset);reset();
</script></body></html>
