<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿拉伯语数词随机抽卡</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#21364a;background:#f3f7fa}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:760px;margin:auto}header{text-align:center}h1{font-size:clamp(24px,5vw,35px)}p{line-height:1.65}.panel,.card{background:white;border-radius:20px;padding:20px;margin:18px 0;box-shadow:0 6px 25px #20344b12}label{display:block;font-weight:700;margin:12px 0 7px}select,input{font-size:17px;width:100%;padding:12px;border:1px solid #b8c8d2;border-radius:10px;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:540px){.grid{grid-template-columns:1fr}}.custom{display:none}.card{text-align:center;min-height:235px;display:flex;flex-direction:column;justify-content:center;gap:18px}.hint{font-size:14px;color:#617789}.question{font-size:clamp(34px,7vw,55px);overflow-wrap:anywhere}.question.ar{font-size:clamp(25px,5vw,38px);line-height:1.9;direction:rtl}.answer{min-height:60px;font-size:clamp(23px,4vw,33px);line-height:1.8;overflow-wrap:anywhere}.answer.ar{direction:rtl}.buttons{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}button{border:0;border-radius:12px;background:#116a78;color:white;font-weight:700;font-size:17px;padding:13px 19px;cursor:pointer}button.secondary{background:#40596c}button:disabled{opacity:.5}footer{text-align:center;font-size:13px;color:#687d89;margin:28px auto}</style></head><body><main><header><h1>🔢 阿拉伯语数词随机抽卡</h1><p>选择难度和出题语言，点击抽卡即可练习。支持 iPad、手机和电脑。</p></header><section class="panel"><div class="grid"><div><label for="level">难度 / 数字范围</label><select id="level"><option value="0,10">一级：0–10</option><option value="11,99">二级：11–99</option><option value="100,999">三级：100–999</option><option value="1000,9999">四级：1,000–9,999</option><option value="10000,999999">五级：10,000–999,999</option><option value="1000000,999999999">六级：百万–近十亿</option><option value="custom">自定义范围</option></select></div><div><label for="mode">卡片正面</label><select id="mode"><option value="digits">数字 → 阿语</option><option value="arabic">阿语 → 数字</option><option value="mixed">混合随机</option></select></div></div><div class="grid custom" id="custom"><div><label for="min">最小整数</label><input id="min" type="number" min="0" max="999999999" value="1"></div><div><label for="max">最大整数</label><input id="max" type="number" min="0" max="999999999" value="999"></div></div><p id="error" role="alert" style="color:#b12b36"></p></section><section class="card" aria-live="polite"><div class="hint" id="hint">点击下方按钮开始</div><div class="question" id="question">؟</div><div class="answer" id="answer"></div></section><div class="buttons"><button id="draw">🎴 随机抽卡</button><button class="secondary" id="reveal" disabled>显示答案</button></div><footer>教学提示：答案采用独立读数的教学约定，默认主格、无被数名词；部分数词在实际句子中会随性别和格位变化。百万以上的复杂数字建议教师核对读法。</footer></main><script>
'use strict';
// 独立基数词：按主格形式展示；为避免多种合法读法，使用一套固定的教学表达。
const units=['صِفْرٌ','وَاحِدٌ','اِثْنَانِ','ثَلَاثَةٌ','أَرْبَعَةٌ','خَمْسَةٌ','سِتَّةٌ','سَبْعَةٌ','ثَمَانِيَةٌ','تِسْعَةٌ'];
const teens=['عَشَرَةٌ','أَحَدَ عَشَرَ','اِثْنَا عَشَرَ','ثَلَاثَةَ عَشَرَ','أَرْبَعَةَ عَشَرَ','خَمْسَةَ عَشَرَ','سِتَّةَ عَشَرَ','سَبْعَةَ عَشَرَ','ثَمَانِيَةَ عَشَرَ','تِسْعَةَ عَشَرَ'];
const tens=['','','عِشْرُونَ','ثَلَاثُونَ','أَرْبَعُونَ','خَمْسُونَ','سِتُّونَ','سَبْعُونَ','ثَمَانُونَ','تِسْعُونَ'];
const hundreds=['','مِائَةٌ','مِائَتَانِ','ثَلَاثُمِائَةٍ','أَرْبَعُمِائَةٍ','خَمْسُمِائَةٍ','سِتُّمِائَةٍ','سَبْعُمِائَةٍ','ثَمَانُمِائَةٍ','تِسْعُمِائَةٍ'];
function under100(n){if(n<10)return units[n];if(n<20)return teens[n-10];let t=Math.floor(n/10),u=n%10;return u?units[u]+' وَ'+tens[t]:tens[t]}
function under1000(n){let h=Math.floor(n/100),r=n%100;return (h?hundreds[h]:'')+(h&&r?' وَ':'')+(r?under100(r):'')}
function scale(group,type){if(type==='thousand'){if(group===1)return 'أَلْفٌ';if(group===2)return 'أَلْفَانِ';if(group<=10)return under1000(group)+' آلَافٍ';return under1000(group)+' أَلْفًا'}if(group===1)return 'مِلْيُونٌ';if(group===2)return 'مِلْيُونَانِ';if(group<=10)return under1000(group)+' مَلَايِينُ';return under1000(group)+' مِلْيُونًا'}
function toArabic(n){if(n<1000)return under1000(n);let million=Math.floor(n/1000000),thousand=Math.floor(n%1000000/1000),rest=n%1000;return [million?scale(million,'million'):'',thousand?scale(thousand,'thousand'):'',rest?under1000(rest):''].filter(Boolean).join(' وَ')}
const $=id=>document.getElementById(id);let current=null;const fmt=new Intl.NumberFormat('en-US');
$('level').addEventListener('change',()=>{$('custom').style.display=$('level').value==='custom'?'grid':'none';$('error').textContent=''});
function range(){if($('level').value!=='custom')return $('level').value.split(',').map(Number);let a=Number($('min').value),b=Number($('max').value);if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||a<0||b>999999999||a>b)throw Error('请输入有效范围：0–999,999,999，且最小值不大于最大值。');return[a,b]}
$('draw').onclick=()=>{try{let [a,b]=range();$('error').textContent='';let n=Math.floor(Math.random()*(b-a+1))+a;let mode=$('mode').value;if(mode==='mixed')mode=Math.random()<.5?'digits':'arabic';current={n,mode};$('hint').textContent=mode==='digits'?'请用阿拉伯语读出数字':'请说出对应的数字';$('question').textContent=mode==='digits'?fmt.format(n):toArabic(n);$('question').className='question'+(mode==='arabic'?' ar':'');$('answer').textContent='';$('answer').className='answer';$('reveal').disabled=false;}catch(e){$('error').textContent=e.message}};
$('reveal').onclick=()=>{if(!current)return;$('answer').textContent=current.mode==='digits'?toArabic(current.n):fmt.format(current.n);$('answer').className='answer'+(current.mode==='digits'?' ar':'')};
</script></body></html>
