<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三母健全动词 · Arabic Classroom</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#203047;background:#f2f6fa}*{box-sizing:border-box}body{margin:0;padding:22px 12px}.wrap{max-width:790px;margin:auto}header{text-align:center;margin-bottom:20px}h1{font-size:clamp(24px,5vw,34px);margin:8px}p{color:#637386}.panel,.card{background:white;border-radius:18px;padding:20px;box-shadow:0 5px 22px #24384a13;margin:14px 0}.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}label{font-size:14px;font-weight:650;display:block;margin-bottom:6px}select,button{font:inherit;border-radius:10px;padding:11px 12px}select{width:100%;background:#f7fafc;border:1px solid #cbd5e1}.card{text-align:center;min-height:255px;display:flex;flex-direction:column;justify-content:center;gap:10px}.sub{font-size:14px;color:#66788a}.arabic{font-family:'Geeza Pro','Noto Naskh Arabic','Traditional Arabic',serif;direction:rtl;font-size:clamp(37px,8vw,60px);line-height:1.6}.prompt{font-size:clamp(23px,5vw,33px);font-weight:750}.arabic.prompt{font-size:clamp(35px,7vw,48px)}.badge{display:inline-block;background:#e8f2fc;color:#225c91;border-radius:20px;padding:5px 12px;font-size:13px;align-self:center}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.actions button{border:0;cursor:pointer;background:#2468a0;color:white;font-weight:650}.actions button.secondary{background:#e6edf5;color:#264662}.actions button:active{transform:translateY(1px)}.answer{background:#f3faf5;border:1px solid #cce9d4;border-radius:12px;padding:13px;text-align:center;margin-top:14px}.answer .arabic{font-size:32px}.hidden{display:none}.foot{text-align:center;font-size:13px;color:#66788a;margin-top:24px}a{color:#2468a0}#count{text-align:center;color:#637386;font-size:13px;margin:10px}</style></head><body><main class="wrap"><header><h1>🎴 三母健全动词变位</h1><p>20个动词 · 中文 / 阿语 / 混合人称 · 过去式 / 现在式</p></header><section class="panel settings"><div><label for="language">人称卡片模式</label><select id="language"><option value="zh">中文</option><option value="ar">阿拉伯语</option><option value="mix">中阿混合</option></select></div><div><label for="tense">练习时态</label><select id="tense"><option value="past">过去式</option><option value="present">现在式</option><option value="mix">过去式与现在式混合</option></select></div><div><label for="verb">动词选择</label><select id="verb"><option value="all">全部20个动词（随机）</option></select></div><div><label for="draw">抽取方式</label><select id="draw"><option value="random">完全随机</option><option value="cycle">不重复（抽完自动重洗）</option></select></div></section><section class="card" aria-live="polite"><div class="badge" id="tenseLabel">过去式</div><div class="sub">动词（统一显示过去式第三人称阳性单数）</div><div class="arabic" id="verbFace">كَتَبَ</div><div class="sub" id="meaning">写</div><div class="sub">指定人称</div><div class="prompt" id="personFace">你们（阳性复数）</div></section><div class="actions"><button id="next">🎲 随机抽卡</button><button class="secondary" id="hint">显示现在式原形</button><button class="secondary" id="reveal">显示变位答案</button><button class="secondary" id="reset">重新洗牌</button></div><div id="count"></div><section id="hintBox" class="answer hidden"><div class="sub">现在式第三人称阳性单数</div><div class="arabic" id="baseAnswer"></div></section><section id="answerBox" class="answer hidden"><div class="sub" id="answerLabel">正确变位</div><div class="arabic" id="conjugated"></div><div class="sub" id="personAnswer"></div></section><div class="foot">独立直陈式练习；现在式使用直陈式（المرفوع）。<br>同形的双数人称按阴阳性分别抽取。 <a href="index.html">返回网站首页</a></div></main><script>
'use strict';
// 每个动词：过去式、现在式、中文、三个词根辅音、过去式中间元音、现在式中间元音。
const verbs=[
['كَتَبَ','يَكْتُبُ','写','ك','ت','ب','َ','ُ'],['دَرَسَ','يَدْرُسُ','学习','د','ر','س','َ','ُ'],
['فَتَحَ','يَفْتَحُ','打开','ف','ت','ح','َ','َ'],['جَلَسَ','يَجْلِسُ','坐','ج','ل','س','َ','ِ'],
['دَخَلَ','يَدْخُلُ','进入','د','خ','ل','َ','ُ'],['خَرَجَ','يَخْرُجُ','出去','خ','ر','ج','َ','ُ'],
['شَرِبَ','يَشْرَبُ','喝','ش','ر','ب','ِ','َ'],['سَمِعَ','يَسْمَعُ','听','س','م','ع','ِ','َ'],
['فَهِمَ','يَفْهَمُ','理解','ف','ه','م','ِ','َ'],['لَعِبَ','يَلْعَبُ','玩','ل','ع','ب','ِ','َ'],
['غَسَلَ','يَغْسِلُ','洗','غ','س','ل','َ','ِ'],['طَبَخَ','يَطْبُخُ','烹饪','ط','ب','خ','َ','ُ'],
['رَسَمَ','يَرْسُمُ','画','ر','س','م','َ','ُ'],['حَمَلَ','يَحْمِلُ','携带','ح','م','ل','َ','ِ'],
['لَبِسَ','يَلْبَسُ','穿','ل','ب','س','ِ','َ'],['رَكِبَ','يَرْكَبُ','乘坐','ر','ك','ب','ِ','َ'],
['سَكَنَ','يَسْكُنُ','居住','س','ك','ن','َ','ُ'],['طَلَبَ','يَطْلُبُ','请求','ط','ل','ب','َ','ُ'],
['حَفِظَ','يَحْفَظُ','记住','ح','ف','ظ','ِ','َ'],['نَزَلَ','يَنْزِلُ','下来','ن','ز','ل','َ','ِ']
];
// 14个变位槽位：两个 هُمَا 和两个 أَنْتُمَا 分别计入阴阳性。
const persons=[
['هُوَ','他','3ms'],['هُمَا','他俩（阳性）','3md'],['هُمْ','他们（阳性复数）','3mp'],
['هِيَ','她','3fs'],['هُمَا','她俩（阴性）','3fd'],['هُنَّ','她们（阴性复数）','3fp'],
['أَنْتَ','你（阳性单数）','2ms'],['أَنْتُمَا','你俩（阳性）','2md'],['أَنْتُمْ','你们（阳性复数）','2mp'],
['أَنْتِ','你（阴性单数）','2fs'],['أَنْتُمَا','你俩（阴性）','2fd'],['أَنْتُنَّ','你们（阴性复数）','2fp'],
['أَنَا','我','1s'],['نَحْنُ','我们','1p']
];
function past(v,p){const [,, ,a,b,c,mid]=v;const full=a+'َ'+b+mid+c;const short=full+'ْ';switch(p){case '3ms':return v[0];case '3md':return full+'َا';case '3mp':return full+'ُوا';case '3fs':return full+'َتْ';case '3fd':return full+'َتَا';case '3fp':return short+'نَ';case '2ms':return short+'تَ';case '2md':case '2fd':return short+'تُمَا';case '2mp':return short+'تُمْ';case '2fs':return short+'تِ';case '2fp':return short+'تُنَّ';case '1s':return short+'تُ';case '1p':return short+'نَا';}}
function present(v,p){const [,,,a,b,c,,mid]=v;const stem=a+'ْ'+b+mid+c;let prefix='يَ',end='ُ';switch(p){case '3ms':break;case '3md':end='َانِ';break;case '3mp':end='ُونَ';break;case '3fs':prefix='تَ';break;case '3fd':prefix='تَ';end='َانِ';break;case '3fp':end='ْنَ';break;case '2ms':prefix='تَ';break;case '2md':case '2fd':prefix='تَ';end='َانِ';break;case '2mp':prefix='تَ';end='ُونَ';break;case '2fs':prefix='تَ';end='ِينَ';break;case '2fp':prefix='تَ';end='ْنَ';break;case '1s':prefix='أَ';break;case '1p':prefix='نَ';break;}return prefix+stem+end;}
const $=id=>document.getElementById(id);verbs.forEach((v,i)=>{let opt=document.createElement('option');opt.value=i;opt.textContent=v[0]+' — '+v[2];$('verb').appendChild(opt)});
let current=null,deck=[];function choices(){const selected=$('verb').value,ts=$('tense').value,ls=$('language').value;const ids=selected==='all'?verbs.map((_,i)=>i):[Number(selected)];const times=ts==='mix'?['past','present']:[ts];const langs=ls==='mix'?['zh','ar']:[ls];return ids.flatMap(vi=>persons.flatMap((_,pi)=>times.flatMap(t=>langs.map(l=>({vi,pi,t,l})))));}
function shuffle(){deck=choices();for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}}
function show(c){current=c;const v=verbs[c.vi],p=persons[c.pi];$('verbFace').textContent=v[0];$('meaning').textContent=v[2];$('tenseLabel').textContent=c.t==='past'?'过去式':'现在式';$('personFace').textContent=c.l==='zh'?p[1]:p[0];$('personFace').className=c.l==='ar'?'arabic prompt':'prompt';$('baseAnswer').textContent=v[1];$('conjugated').textContent=c.t==='past'?past(v,p[2]):present(v,p[2]);$('personAnswer').textContent=p[0]+' — '+p[1];$('answerLabel').textContent=c.t==='past'?'过去式正确变位':'现在式正确变位';$('hintBox').classList.add('hidden');$('answerBox').classList.add('hidden');$('count').textContent=$('draw').value==='cycle'?'本轮剩余 '+deck.length+' 张':'完全随机模式';}
function next(){if($('draw').value==='cycle'){if(!deck.length)shuffle();show(deck.pop());}else{const pool=choices();show(pool[Math.floor(Math.random()*pool.length)]);}}
$('next').onclick=next;$('hint').onclick=()=>{if(current)$('hintBox').classList.toggle('hidden')};$('reveal').onclick=()=>{if(current)$('answerBox').classList.toggle('hidden')};$('reset').onclick=()=>{shuffle();next()};['language','tense','verb','draw'].forEach(id=>$(id).addEventListener('change',()=>{deck=[];next()}));next();
</script></body></html>
